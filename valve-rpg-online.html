    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Special Elite', cursive;
            background: linear-gradient(135deg, #1a1410 0%, #2d1b0e 100%);
            color: #f4e4c1;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* LOGIN SECTION */
        .login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 30px;
        }

        .login-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 4em;
            color: #c9a961;
            text-shadow: 0 0 20px rgba(201, 169, 97, 0.5);
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(201, 169, 97, 0.5); }
            to { text-shadow: 0 0 40px rgba(201, 169, 97, 0.8), 0 0 60px rgba(201, 169, 97, 0.6); }
        }

        .role-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .role-btn {
            padding: 15px 40px;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.2em;
            background: linear-gradient(135deg, #5f4d43 0%, #3d2f28 100%);
            border: 2px solid #8b6f47;
            color: #f4e4c1;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 5px;
        }

        .role-btn:hover {
            background: linear-gradient(135deg, #8b6f47 0%, #5f4d43 100%);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(201, 169, 97, 0.4);
        }

        .role-btn.active {
            background: linear-gradient(135deg, #c9a961 0%, #8b6f47 100%);
            border-color: #c9a961;
            color: #1a1410;
        }

        .login-form {
            background: rgba(45, 27, 14, 0.8);
            border: 2px solid #8b6f47;
            border-radius: 10px;
            padding: 40px;
            min-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #c9a961;
            font-size: 1.1em;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(26, 20, 16, 0.6);
            border: 1px solid #8b6f47;
            border-radius: 5px;
            color: #f4e4c1;
            font-family: 'Special Elite', cursive;
            font-size: 1em;
        }

        .form-group input:focus {
            outline: none;
            border-color: #c9a961;
            box-shadow: 0 0 10px rgba(201, 169, 97, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #c9a961 0%, #8b6f47 100%);
            border: none;
            border-radius: 5px;
            color: #1a1410;
            font-family: 'Cinzel Decorative', cursive;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(201, 169, 97, 0.5);
        }

        .hidden {
            display: none !important;
        }

        /* DASHBOARD */
        .dashboard {
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-header {
            background: rgba(45, 27, 14, 0.8);
            border: 2px solid #8b6f47;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .user-info h2 {
            font-family: 'Cinzel Decorative', cursive;
            color: #c9a961;
            font-size: 1.5em;
        }

        .session-code {
            color: #8b6f47;
            font-size: 0.9em;
        }

        .logout-btn {
            padding: 10px 30px;
            background: linear-gradient(135deg, #8b3a3a 0%, #5f2828 100%);
            border: 2px solid #a04040;
            border-radius: 5px;
            color: #f4e4c1;
            font-family: 'Cinzel Decorative', cursive;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #a04040 0%, #8b3a3a 100%);
            transform: translateY(-2px);
        }

        /* MASTER PANEL */
        .master-panel {
            background: rgba(45, 27, 14, 0.8);
            border: 2px solid #8b6f47;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .master-panel h3 {
            font-family: 'Cinzel Decorative', cursive;
            color: #c9a961;
            font-size: 1.8em;
            margin-bottom: 20px;
            text-align: center;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .player-card {
            background: rgba(26, 20, 16, 0.8);
            border: 2px solid #8b6f47;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .player-card:hover {
            border-color: #c9a961;
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(201, 169, 97, 0.3);
        }

        .player-card.active {
            border-color: #c9a961;
            background: rgba(201, 169, 97, 0.1);
        }

        .player-card h4 {
            color: #c9a961;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .player-status {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #8b6f47;
        }

        .remove-player {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #8b3a3a;
            border: none;
            color: #f4e4c1;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s ease;
        }

        .remove-player:hover {
            background: #a04040;
            transform: scale(1.1);
        }

        /* FICHA CONTAINER */
        .ficha-container {
            background: rgba(45, 27, 14, 0.8);
            border: 2px solid #8b6f47;
            border-radius: 10px;
            padding: 20px;
            min-height: 600px;
        }

        .ficha-container iframe {
            width: 100%;
            height: 100vh;
            border: none;
            border-radius: 5px;
        }

        .no-player-selected {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: #8b6f47;
            font-size: 1.2em;
            text-align: center;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .login-form {
                min-width: 90vw;
                padding: 30px 20px;
            }

            .login-title {
                font-size: 2.5em;
            }

            .role-selector {
                flex-direction: column;
                width: 100%;
            }

            .dashboard-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .players-grid {
                grid-template-columns: 1fr;
            }
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .status-online {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-offline {
            background: #6b7280;
        }
    </style>

<body>
    <div class="container">
        <!-- LOGIN SECTION -->
        <div id="loginSection" class="login-section">
            <h1 class="login-title">VALVE RPG</h1>

            <div class="role-selector">
                <button class="role-btn active" onclick="selectRole(&#39;player&#39;)">JOGADOR</button>
                <button class="role-btn" onclick="selectRole(&#39;master&#39;)">MESTRE</button>
            </div>

            <!-- Player Form -->
            <div id="playerForm" class="login-form">
                <div class="form-group">
                    <label>Nome do Personagem:</label>
                    <input type="text" id="playerName" placeholder="Digite o nome do personagem">
                </div>
                <div class="form-group">
                    <label>Código da Sessão:</label>
                    <input type="text" id="playerSessionCode" placeholder="Digite o código da sessão">
                </div>
                <button class="submit-btn" onclick="loginAsPlayer()">ENTRAR NA SESSÃO</button>
            </div>

            <!-- Master Form -->
            <div id="masterForm" class="login-form hidden">
                <div class="form-group">
                    <label>Nome do Mestre:</label>
                    <input type="text" id="masterName" placeholder="Digite seu nome">
                </div>
                <div class="form-group">
                    <label>Código da Sessão:</label>
                    <input type="text" id="masterSessionCode" placeholder="Deixe em branco para criar nova">
                </div>
                <button class="submit-btn" onclick="loginAsMaster()">CRIAR/ENTRAR SESSÃO</button>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="dashboard hidden">
            <div class="dashboard-header">
                <div class="user-info">
                    <h2 id="userName"></h2>
                    <span class="session-code">Sessão: <strong id="sessionCode"></strong></span>
                </div>
                <button class="logout-btn" onclick="logout()">SAIR</button>
            </div>

            <!-- Master Panel -->
            <div id="masterPanel" class="master-panel hidden">
                <h3>JOGADORES NA SESSÃO</h3>
                <div id="playersGrid" class="players-grid"></div>
            </div>

            <!-- Ficha Container -->
            <div id="fichaContainer" class="ficha-container">
                <div class="no-player-selected">
                    <p id="fichaMessage">Carregando ficha...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="./valve-rpg-online_files/firebase-app-compat.js.download"></script>
    <script src="./valve-rpg-online_files/firebase-auth-compat.js.download"></script>
    <script src="./valve-rpg-online_files/firebase-firestore-compat.js.download"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
  apiKey: "AIzaSyAenYU8S3JkkcR3Mhy19ujNAnUfb7EU74w",
  authDomain: "valve-rpg-system.firebaseapp.com",
  projectId: "valve-rpg-system",
  storageBucket: "valve-rpg-system.firebasestorage.app",
  messagingSenderId: "456413195150",
  appId: "1:456413195150:web:11fc2c93bb7cc5a9ef12df"
};


        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Global Variables
        let currentUser = null;
        let currentRole = 'player';
        let currentSession = null;
        let currentPlayerId = null;
        let syncInterval = null;
        let playersListener = null;
        let fichaDataListener = null;

        // Role Selection
        function selectRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (role === 'player') {
                document.getElementById('playerForm').classList.remove('hidden');
                document.getElementById('masterForm').classList.add('hidden');
            } else {
                document.getElementById('playerForm').classList.add('hidden');
                document.getElementById('masterForm').classList.remove('hidden');
            }
        }

        // Generate Random Session Code
        function generateSessionCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // Login as Player
        async function loginAsPlayer() {
            const playerName = document.getElementById('playerName').value.trim();
            const sessionCode = document.getElementById('playerSessionCode').value.trim().toUpperCase();

            if (!playerName || !sessionCode) {
                alert('Por favor, preencha todos os campos!');
                return;
            }

            try {
                // Login anonimamente
                const userCredential = await auth.signInAnonymously();
                currentUser = userCredential.user;

                // Verificar se a sessão existe
                const sessionRef = db.collection('sessions').doc(sessionCode);
                const sessionDoc = await sessionRef.get();

                if (!sessionDoc.exists) {
                    alert('Sessão não encontrada! Verifique o código.');
                    await auth.signOut();
                    return;
                }

                currentSession = sessionCode;

                // Adicionar jogador à sessão
                const playerId = currentUser.uid;
                currentPlayerId = playerId;

                await sessionRef.collection('players').doc(playerId).set({
                    name: playerName,
                    userId: playerId,
                    lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                    online: true
                });

                // Criar documento de dados da ficha se não existir
                const fichaRef = sessionRef.collection('fichasData').doc(playerId);
                const fichaDoc = await fichaRef.get();

                if (!fichaDoc.exists) {
                    await fichaRef.set({
                        playerName: playerName,
                        lastUpdate: firebase.firestore.FieldValue.serverTimestamp(),
                        data: {}
                    });
                }

                showDashboard(playerName, sessionCode, 'player');
                setupPlayerSync(sessionCode, playerId);
            } catch (error) {
                console.error('Erro ao fazer login:', error);
                alert('Erro ao entrar na sessão: ' + error.message);
            }
        }

        // Login as Master
        async function loginAsMaster() {
            const masterName = document.getElementById('masterName').value.trim();
            let sessionCode = document.getElementById('masterSessionCode').value.trim().toUpperCase();

            if (!masterName) {
                alert('Por favor, digite seu nome!');
                return;
            }

            try {
                const userCredential = await auth.signInAnonymously();
                currentUser = userCredential.user;

                // Criar nova sessão se não forneceu código
                if (!sessionCode) {
                    sessionCode = generateSessionCode();
                    await db.collection('sessions').doc(sessionCode).set({
                        masterName: masterName,
                        masterId: currentUser.uid,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    // Verificar se sessão existe
                    const sessionDoc = await db.collection('sessions').doc(sessionCode).get();
                    if (!sessionDoc.exists) {
                        alert('Sessão não encontrada!');
                        await auth.signOut();
                        return;
                    }
                }

                currentSession = sessionCode;
                showDashboard(masterName, sessionCode, 'master');
                setupMasterPanel(sessionCode);
            } catch (error) {
                console.error('Erro ao fazer login:', error);
                alert('Erro ao criar/entrar sessão: ' + error.message);
            }
        }

        // Show Dashboard
        function showDashboard(userName, sessionCode, role) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userName').textContent = userName;
            document.getElementById('sessionCode').textContent = sessionCode;

            if (role === 'master') {
                document.getElementById('masterPanel').classList.remove('hidden');
                document.getElementById('fichaMessage').textContent = 'Selecione um jogador para ver a ficha';
            } else {
                document.getElementById('masterPanel').classList.add('hidden');
                loadPlayerFicha();
            }
        }

        // Setup Player Sync (Player sends data to Firebase)
        function setupPlayerSync(sessionCode, playerId) {
            // Receber mensagens do iframe da ficha
            window.addEventListener('message', async (event) => {
                if (event.data.type === 'SAVE_FICHA_DATA') {
                    try {
                        const fichaRef = db.collection('sessions').doc(sessionCode)
                            .collection('fichasData').doc(playerId);

                        await fichaRef.set({
                            data: event.data.data,
                            lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
                        }, { merge: true });

                        // Atualizar lastSeen do jogador
                        await db.collection('sessions').doc(sessionCode)
                            .collection('players').doc(playerId)
                            .update({
                                lastSeen: firebase.firestore.FieldValue.serverTimestamp()
                            });
                    } catch (error) {
                        console.error('Erro ao salvar dados:', error);
                    }
                }
            });

            // Heartbeat para manter jogador online
            setInterval(async () => {
                try {
                    await db.collection('sessions').doc(sessionCode)
                        .collection('players').doc(playerId)
                        .update({
                            lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                            online: true
                        });
                } catch (error) {
                    console.error('Erro ao atualizar status:', error);
                }
            }, 10000); // A cada 10 segundos
        }

        // Load Player Ficha
        function loadPlayerFicha() {
            const container = document.getElementById('fichaContainer');
            container.innerHTML = `<iframe src="https://dede3phc22dgx.cloudfront.net/creao2/dcaaa326-c36e-4585-ab82-3ff22c26afb5/78c153d0-8021-708c-3a82-42e7f890ce9f/9fdb68a6-71b1-4c55-8a8a-fc0f520aab00/ficha-rpg-valve-mobile-FIXED.html?session=${currentSession}&player=${currentPlayerId}&role=player"></iframe>`;
        }

        // Setup Master Panel
        function setupMasterPanel(sessionCode) {
            const playersRef = db.collection('sessions').doc(sessionCode).collection('players');

            // Listener em tempo real para jogadores
            playersListener = playersRef.onSnapshot((snapshot) => {
                const playersGrid = document.getElementById('playersGrid');
                playersGrid.innerHTML = '';

                snapshot.forEach((doc) => {
                    const player = doc.data();
                    const playerId = doc.id;

                    // Verificar se está online (último update há menos de 30 segundos)
                    const isOnline = player.lastSeen &&
                        (Date.now() - player.lastSeen.toMillis() < 30000);

                    const playerCard = document.createElement('div');
                    playerCard.className = 'player-card';
                    playerCard.innerHTML = `
                        <button class="remove-player" onclick="removePlayer('${playerId}')">×</button>
                        <h4>${player.name}</h4>
                        <div class="player-status">
                            <span>
                                <span class="status-indicator ${isOnline ? 'status-online' : 'status-offline'}"></span>
                                ${isOnline ? 'Online' : 'Offline'}
                            </span>
                        </div>
                    `;

                    playerCard.onclick = (e) => {
                        if (!e.target.classList.contains('remove-player')) {
                            selectPlayer(playerId, player.name);
                        }
                    };

                    playersGrid.appendChild(playerCard);
                });

                if (snapshot.empty) {
                    playersGrid.innerHTML = '<p style="text-align: center; color: #8b6f47;">Nenhum jogador na sessão ainda</p>';
                }
            });
        }

        // Select Player (Master View)
        function selectPlayer(playerId, playerName) {
            // Remover active de todos os cards
            document.querySelectorAll('.player-card').forEach(card => {
                card.classList.remove('active');
            });

            // Adicionar active ao card clicado
            event.currentTarget.classList.add('active');

            // Limpar listener anterior se existir
            if (fichaDataListener) {
                fichaDataListener();
            }

            // Carregar ficha do jogador com sincronização em tempo real
            const container = document.getElementById('fichaContainer');
            container.innerHTML = `<iframe id="fichaIframe" src="https://dede3phc22dgx.cloudfront.net/creao2/dcaaa326-c36e-4585-ab82-3ff22c26afb5/78c153d0-8021-708c-3a82-42e7f890ce9f/9fdb68a6-71b1-4c55-8a8a-fc0f520aab00/ficha-rpg-valve-mobile-FIXED.html?session=${currentSession}&player=${playerId}&role=master"></iframe>`;

            // Listener em tempo real para dados da ficha
            const fichaRef = db.collection('sessions').doc(currentSession)
                .collection('fichasData').doc(playerId);

            fichaDataListener = fichaRef.onSnapshot((doc) => {
                if (doc.exists) {
                    const iframe = document.getElementById('fichaIframe');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage({
                            type: 'LOAD_FICHA_DATA',
                            data: doc.data().data || {}
                        }, '*');
                    }
                }
            });
        }

        // Remove Player
        async function removePlayer(playerId) {
            if (!confirm('Tem certeza que deseja remover este jogador?')) {
                return;
            }

            try {
                await db.collection('sessions').doc(currentSession)
                    .collection('players').doc(playerId).delete();

                await db.collection('sessions').doc(currentSession)
                    .collection('fichasData').doc(playerId).delete();

                alert('Jogador removido com sucesso!');
            } catch (error) {
                console.error('Erro ao remover jogador:', error);
                alert('Erro ao remover jogador: ' + error.message);
            }
        }

        // Logout
        async function logout() {
            if (currentRole === 'player' && currentSession && currentPlayerId) {
                // Marcar jogador como offline
                try {
                    await db.collection('sessions').doc(currentSession)
                        .collection('players').doc(currentPlayerId)
                        .update({ online: false });
                } catch (error) {
                    console.error('Erro ao atualizar status:', error);
                }
            }

            // Limpar listeners
            if (playersListener) playersListener();
            if (fichaDataListener) fichaDataListener();
            if (syncInterval) clearInterval(syncInterval);

            await auth.signOut();

            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');

            // Limpar formulários
            document.getElementById('playerName').value = '';
            document.getElementById('playerSessionCode').value = '';
            document.getElementById('masterName').value = '';
            document.getElementById('masterSessionCode').value = '';

            currentUser = null;
            currentSession = null;
            currentPlayerId = null;
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (currentRole === 'player' && currentSession && currentPlayerId) {
                navigator.sendBeacon('/api/offline', JSON.stringify({
                    session: currentSession,
                    player: currentPlayerId
                }));
            }
        });
    </script>


</body></html>
